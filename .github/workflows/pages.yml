name: Deploy Pages

# Publishes the generated cards as a browsable page. It has nothing to fetch:
# the site is assembled from what is already committed in images/, so a deploy
# is cheap and can follow every generator run.

on:
  # The generator dispatches this explicitly after it has pushed fresh images
  # to main. This is reliable even though that push uses GITHUB_TOKEN.

  # And whenever the page itself changes
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - 'fonts/**'
      - '.github/workflows/pages.yml'

  # Manual, so a branch can be previewed before it is merged
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer one win: the site is a snapshot of the
# images in the repository, so an in-flight older build has nothing to finish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12'

      # sharp rasterises the share preview. `--ignore-scripts` skips
      # puppeteer's Chromium download, which this job has no use for; sharp
      # itself ships prebuilt binaries as optional dependencies and needs no
      # install script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Before the build, so the page's canonical and Open Graph URLs are the
      # address it is actually deployed to — including a custom domain.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
