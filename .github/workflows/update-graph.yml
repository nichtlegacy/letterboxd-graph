name: Update Letterboxd Graph + JSON Export

# ╔════════════════════════════════════════════════════════════════╗
# ║  CONFIGURATION - Edit these values for your Letterboxd profile ║
# ╚════════════════════════════════════════════════════════════════╝
env:
  LETTERBOXD_USERNAME: "nichtlegacy"  # Your Letterboxd username
  YEARS: "2026,2025"                   # Years to generate (e.g. "2026,2025" or leave empty for current)
  EXPORT_PNG: "false"                  # Set to "true" to also generate PNG files
  WEEK_START: "sunday"                 # "sunday" or "monday"
  GRADIENT: "true"                     # "true" for colored name, "false" for white
  ANIMATE: "true"                      # "false" to disable the cell reveal animation
  SCOPE: "all"                         # "all" (whole diary) or "years"
  MONTH_CARDS: "2"                     # recent months to also make cards for, 0 to skip
  TOP_FILMS: "watched"                 # "watched" or "released" for the card film list

on:
  # Daily at midnight UTC (main only)
  schedule:
    - cron: "0 0 * * *"

  # On push to main or dev
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-letterboxd-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The graph itself is generated by the action defined in this repository,
      # so every scheduled run doubles as an end-to-end test of what external
      # consumers get from `uses: nichtlegacy/letterboxd-graph@v2`. The steps
      # below only cover the test suite, which the action deliberately does not
      # run for consumers.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install curl_cffi fetcher
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install curl_cffi==0.14.0

      - name: Run tests
        run: npm test

      - name: Generate and commit graph
        uses: ./
        with:
          username: ${{ env.LETTERBOXD_USERNAME }}
          years: ${{ env.YEARS }}
          week-start: ${{ env.WEEK_START }}
          gradient: ${{ env.GRADIENT }}
          animate: ${{ env.ANIMATE }}
          scope: ${{ env.SCOPE }}
          month-cards: ${{ env.MONTH_CARDS }}
          top-films: ${{ env.TOP_FILMS }}
          export-png: ${{ env.EXPORT_PNG }}
          output: images/github-letterboxd
