name: Update Letterboxd Graph + JSON Export

# ╔════════════════════════════════════════════════════════════════╗
# ║  CONFIGURATION - Edit these values for your Letterboxd profile ║
# ╚════════════════════════════════════════════════════════════════╝
#
# What one run writes with the settings below:
#
#   github-letterboxd-{dark,light}.svg          this year and last, one block each
#   letterboxd-review-<year>-{dark,light}.svg   a card per year in REVIEW_YEARS
#   letterboxd-review-current-month-*.svg       this month
#   letterboxd-review-previous-month-*.svg      last month
#   letterboxd-profile-{dark,light}.svg         all-time, not tied to a year
#   letterboxd-data.json                        the figures, including all-time
#
env:
  LETTERBOXD_USERNAME: "nichtlegacy"  # Your Letterboxd username
  YEARS: "last 2"                      # "last 2" = this year and last, or a list like "2026,2025"
  REVIEW_YEARS: "all"                  # "all" = every year present in the fetched diary
  SCOPE: "all"                         # "all" reads the whole diary — needed for all-time figures
  MONTH_CARDS: "2"                     # this month and last month, 0 to skip
  TOP_FILMS: "released"                # year cards rank "released" that year or everything "watched"
  MODE: "count"                        # cell colour: "count" of films or average "rating"
  WEEK_START: "sunday"                 # "sunday" or "monday"
  GRADIENT: "true"                     # "true" for colored name, "false" for white
  ANIMATE: "true"                      # "false" to disable the cell reveal animation
  EXPORT_PNG: "false"                  # Set to "true" to also generate PNG files

on:
  # Daily at midnight UTC (main only)
  schedule:
    - cron: "0 0 * * *"

  # On push to main or dev. Every run reads the whole diary off someone else's
  # servers, so pushes that cannot change what is drawn do not trigger one — the
  # page is built from the committed images by the Pages workflow after a
  # successful main run.
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'site/**'
      - 'scripts/**'
      - '.github/assets/**'
      - '.github/workflows/pages.yml'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-letterboxd-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The graph itself is generated by the action defined in this repository,
      # so every scheduled run doubles as an end-to-end test of what external
      # consumers get from `uses: nichtlegacy/letterboxd-graph@v2`. The steps
      # below only cover the test suite, which the action deliberately does not
      # run for consumers.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install curl_cffi fetcher
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install curl_cffi==0.14.0

      - name: Run tests
        run: npm test

      - name: Generate and commit graph
        uses: ./
        with:
          username: ${{ env.LETTERBOXD_USERNAME }}
          years: ${{ env.YEARS }}
          review-years: ${{ env.REVIEW_YEARS }}
          scope: ${{ env.SCOPE }}
          month-cards: ${{ env.MONTH_CARDS }}
          top-films: ${{ env.TOP_FILMS }}
          mode: ${{ env.MODE }}
          week-start: ${{ env.WEEK_START }}
          gradient: ${{ env.GRADIENT }}
          animate: ${{ env.ANIMATE }}
          export-png: ${{ env.EXPORT_PNG }}
          output: images/github-letterboxd

      # A push made with GITHUB_TOKEN does not trigger another workflow from a
      # push event. Dispatch Pages explicitly after the action has pushed the
      # generated images, so it builds from the current main branch tip.
      - name: Deploy updated site
        if: ${{ github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
